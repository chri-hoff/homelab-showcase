services:
  cadvisor:
    # gcr.io/cadvisor/cadvisor stopped at v0.55.1; releases continue on ghcr.io (tags
    # without "v" exist for every release, with "v" only from 0.57 on).
    image: ghcr.io/google/cadvisor:${VERSION}
    container_name: cadvisor
    env_file:
      - cadvisor.env
    # Hardening (#103, STEP 6): instead of privileged -- read-only mounts plus
    # DAC_READ_SEARCH (walk container layers owned by other UIDs) and /dev/kmsg +
    # SYSLOG for OOM-kill events. Health check comes with the image.
    mem_limit: 1280m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYSLOG
    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    labels:
      - traefik.enable=true
      - traefik.http.routers.cadvisor-http.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.cadvisor-http.entrypoints=websecure
      - traefik.http.services.cadvisor.loadbalancer.server.port=8080
      - traefik.http.routers.cadvisor-http.tls=true
      - traefik.http.routers.cadvisor-http.tls.certresolver=ipv64
      - traefik.http.routers.cadvisor-http.middlewares=std-app-internal-chain@file

    restart: unless-stopped
    networks:
      - frontend
      - backend
networks:
  frontend:
    external: true
  backend:
    external: true

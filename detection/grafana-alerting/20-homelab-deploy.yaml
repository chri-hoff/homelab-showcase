# homelab-deploy calls that do not come from Kestra (172.22.0.250), were rejected
# or targeted an excluded service (rc 3) -- including own "sudo homelab-deploy" (#100).
# Grafana alert rule, provisioning format (Issue #123). One file = one rule = one
# evaluation group. Templates use {{ .Labels.x }} instead of
# $labels: provisioning files interpolate $VARIABLES from the environment.
apiVersion: 1
groups:
    - orgId: 1
      name: homelab-deploy
      folder: Homelab
      interval: 1m
      rules:
        - uid: cg2hu90i445c0e
          title: "HomeLab Deploy"
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfu95v5rjgf7kc
              model:
                datasource:
                    type: loki
                    uid: dfu95v5rjgf7kc
                editorMode: code
                expr: "sum by (caller, action) (count_over_time({syslog_identifier=\"homelab-deploy\"} !~ \"caller=ssh:172\\\\.22\\\\.0\\\\.250 action=\\\\S+ arg=\\\\S+ result=rc[012]$\" | regexp \"caller=(?P<caller>\\\\S+) action=(?P<action>\\\\S+)\" [5m]))"
                instant: true
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      type: query
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: "homelab-deploy {{ .Labels.action }} von {{ .Labels.caller }} (nicht Kestra, abgelehnt oder ausgenommen)"
            description: "Details: sudo journalctl -t homelab-deploy -n 20 auf dem Host"
          isPaused: false
          notification_settings:
            receiver: Telegram
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 4h

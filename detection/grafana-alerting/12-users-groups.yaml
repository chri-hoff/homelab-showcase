# Accounts or groups changed (useradd, usermod, passwd, ...): a typical step after a break-in.
# Grafana alert rule, provisioning format (Issue #123). One file = one rule = one
# evaluation group. Templates use {{ .Labels.x }} instead of
# $labels: provisioning files interpolate $VARIABLES from the environment.
apiVersion: 1
groups:
    - orgId: 1
      name: users-groups
      folder: Admins
      interval: 10s
      rules:
        - uid: fg2i31465ukg0f
          title: "Benutzer oder Gruppen geändert"
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfu95v5rjgf7kc
              model:
                datasource:
                    type: loki
                    uid: dfu95v5rjgf7kc
                editorMode: code
                expr: "sum by (syslog_identifier) (count_over_time({syslog_identifier=~\"useradd|usermod|userdel|groupadd|groupmod|groupdel|gpasswd|passwd|chpasswd\"} [5m]))"
                instant: true
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      type: query
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: "Konto/Gruppe geändert durch {{ .Labels.syslog_identifier }}"
            description: "Details: sudo journalctl -t {{ .Labels.syslog_identifier }} -n 20 auf dem Host"
          isPaused: false
          notification_settings:
            receiver: Telegram
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 4h

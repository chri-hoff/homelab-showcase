# AppArmor denied an action. All containers run with cap_drop ALL + no-new-privileges
# (#103), so a denial means a process tried to do more than allowed.
# Grafana alert rule, provisioning format (Issue #123). One file = one rule = one
# evaluation group. Templates use {{ .Labels.x }} instead of
# $labels: provisioning files interpolate $VARIABLES from the environment.
apiVersion: 1
groups:
    - orgId: 1
      name: apparmor-denied
      folder: Admins
      interval: 10s
      rules:
        - uid: cg2i34xpnknpcc
          title: "AppArmor blockiert etwas"
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfu95v5rjgf7kc
              model:
                datasource:
                    type: loki
                    uid: dfu95v5rjgf7kc
                editorMode: code
                expr: "sum by (profile, comm) (count_over_time({syslog_identifier=\"kernel\"} |= \"apparmor=\\\"DENIED\\\"\" | regexp \"profile=\\\"(?P<profile>[^\\\"]+)\\\".*comm=\\\"(?P<comm>[^\\\"]+)\\\"\" [5m]))"
                instant: true
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      type: query
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: "AppArmor DENIED: {{ .Labels.comm }} (Profil {{ .Labels.profile }})"
            description: "Details: sudo journalctl -k -g apparmor -n 20 auf dem Host"
          isPaused: false
          notification_settings:
            receiver: Telegram
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 4h

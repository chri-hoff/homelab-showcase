# SSH login on the host. Excludes exactly the deploy wrapper's logins from Kestra
# (user deploy FROM 172.22.0.250); deploy from any other address still fires.
# Grafana alert rule, provisioning format (Issue #123). One file = one rule = one
# evaluation group. Templates use {{ .Labels.x }} instead of
# $labels: provisioning files interpolate $VARIABLES from the environment.
apiVersion: 1
groups:
    - orgId: 1
      name: ssh-login
      folder: Admins
      interval: 10s
      rules:
        - uid: dfv5vnultzq4gd
          title: "SSH-Login"
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfu95v5rjgf7kc
              model:
                datasource:
                    type: loki
                    uid: dfu95v5rjgf7kc
                editorMode: code
                expr: "sum by (ssh_user, ssh_from) (count_over_time({job=\"loki.source.journal.journal\"} |= \"Accepted\" !~ \"Accepted publickey for deploy from 172\\\\.22\\\\.0\\\\.250 port \" | regexp \"Accepted \\\\S+ for (?P<ssh_user>\\\\S+) from (?P<ssh_from>\\\\S+)\" [1m]))"
                instant: true
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      type: query
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: "🔓 SSH-Login: {{ .Labels.ssh_user }} von {{ .Labels.ssh_from }}"
            description: "Details: sudo journalctl -u ssh -n 20 auf dem Host"
          isPaused: false
          notification_settings:
            receiver: Telegram
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 4h

# Write access (create/update/patch/delete) to secrets under homelab/ (#101 STEP 2). No service
# writes secrets today; changes are manual admin work. Once secret rotation (YubiKey issue)
# exists, its role gets excluded here.
# Grafana alert rule, provisioning format (Issue #123). One file = one rule = one
# evaluation group. Templates use {{ .Labels.x }} instead of
# $labels: provisioning files interpolate $VARIABLES from the environment.
apiVersion: 1
groups:
    - orgId: 1
      name: vault-secret-write
      folder: Admins
      interval: 10s
      rules:
        - uid: dg3k7vaultwrite01a
          title: "Vault: Secret geändert"
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfu95v5rjgf7kc
              model:
                datasource:
                    type: loki
                    uid: dfu95v5rjgf7kc
                editorMode: code
                expr: "sum by (auth_display_name, request_operation, request_path) (count_over_time({container=\"vault\"} |= \"\\\"type\\\":\\\"response\\\"\" | json | request_path=~\"homelab/(data|metadata)/.+\" and request_operation=~\"create|update|patch|delete\" and error=\"\" [5m]))"
                instant: true
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      type: query
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          annotations:
            summary: "Vault: {{ .Labels.request_operation }} {{ .Labels.request_path }} durch {{ .Labels.auth_display_name }}"
            description: "Details: sudo grep 'homelab/' /opt/docker/vault/logs/audit.log | tail -5"
          isPaused: false
          notification_settings:
            receiver: Telegram
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 4h

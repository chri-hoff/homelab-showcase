id: mindwtr-fetch
namespace: homelab

tasks:
  - id: fetch-tasks
    type: io.kestra.plugin.scripts.shell.Commands
    # #100: runs inside the Kestra container (curl + python3), no task container
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    timeout: PT1M
    env:
      MINDWTR_TOKEN: "{{ secret('MINDWTR_TOKEN') }}"
    commands:
      - |
        set -e
        curl -sf -H "Authorization: Bearer $MINDWTR_TOKEN" "http://mindwtr-cloud:8787/v1/tasks" \
          | python3 -m json.tool

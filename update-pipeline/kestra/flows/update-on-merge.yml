# Kestra flow for Issue #4: Gitea push webhook -> deploy changed services.
#
# #100: Kestra no longer touches Docker, git or the SOPS age key. The flow calls
# "homelab-deploy auto-update" on the host via SSH (forced command, user "deploy",
# not in group docker): git pull of the host checkout as its owner, then deploy every
# service whose .env.sops or versions.yaml version changed (same rules as the former
# sops-auto-update.fish: vault/authentik/traefik/kestra and updateable: false stay
# manual, new versions.yaml entries are not deployed). The age key is fetched from
# Vault by the wrapper for the duration of the call only.
#
# Only pushes to main of owner/homelab are processed; everything else (other branches,
# a manual "Execute" without a payload) ends in the "ignored" branch. For a manual
# run on the host: sudo homelab-deploy auto-update
#
# Telegram summary in "finally" (at most ~4000 characters, see telegram-send.py).
#
# Gitea webhook (repo settings -> Webhooks -> Gitea):
#   Target URL:  http://kestra:8080/api/v1/executions/webhook/homelab/update-on-merge/<triggers.key>
#   Trigger On:  Push Events, branch filter: main
#   (internal over the "backend" network; Gitea's [webhook] ALLOWED_HOST_LIST must
#   allow the host)

id: update-on-merge
namespace: homelab

triggers:
  - id: gitea-push-main
    type: io.kestra.plugin.core.trigger.Webhook
    # From Vault (homelab/services/kestra-webhooks, field update_on_merge), #100
    key: "{{ secret('UPDATE_ON_MERGE_WEBHOOK_KEY') }}"

tasks:
  - id: only-main
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (trigger.body.ref | default('')) == 'refs/heads/main' and (trigger.body.repository.full_name | default('')) == 'owner/homelab' }}"
    then:
      - id: auto-update
        type: io.kestra.plugin.fs.ssh.Command
        # #100: the only path to Docker -- homelab-deploy on the host (forced command)
        host: 172.22.0.1
        username: deploy
        authMethod: PUBLIC_KEY
        privateKey: "{{ secret('DEPLOY_SSH_KEY') }}"
        timeout: PT30M
        commands:
          - auto-update
    else:
      - id: ignored
        type: io.kestra.plugin.core.log.Log
        message: "Kein Push auf main von owner/homelab ({{ trigger.body.ref | default('ohne Payload') }}) -- nichts zu tun."

finally:
  - id: telegram-notify
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      BOT_TOKEN: "{{ secret('TELEGRAM_BOT_TOKEN') }}"
      CHAT_ID: "{{ secret('TELEGRAM_CHAT_ID') }}"
      REF: "{{ trigger.body.ref | default('') }}"
      REPORT: "{{ outputs['auto-update'].vars.report | default('') }}"
    commands:
      - |
        set -e
        [ "$REF" = "refs/heads/main" ] || exit 0
        if [ -z "$REPORT" ]; then
          MSG="update-on-merge FEHLGESCHLAGEN -- kein Bericht, siehe Kestra-Logs"
        elif printf '%s' "$REPORT" | grep -qE '^(FEHLER|docker compose up fehlgeschlagen)'; then
          MSG=$(printf 'update-on-merge mit Fehlern\n\n%s' "$REPORT")
        else
          MSG=$(printf 'update-on-merge OK\n\n%s' "$REPORT")
        fi
        printf '%s' "$MSG" | python3 /repo/scripts/kestra/telegram-send.py

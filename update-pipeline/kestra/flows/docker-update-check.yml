# Kestra flow: daily Docker image update check + Telegram notification.
# Runs on a cron (daily 07:00) AND via webhook (trigger "telegram-trigger") -- the
# latter is fired by telegram-listener.yml when "checkversion" is typed in the
# Telegram chat.
#
# #100: no task containers and no Docker access in Kestra anymore. Registry lookups
# and "docker ps" run on the host through homelab-deploy (SSH, forced command:
# actions update-check and ps); the Supabase/Mindwtr/n8n part runs in the Kestra
# container itself (python3, repo mounted read-only at /repo); versions.yaml is
# committed through the Gitea API (scripts/supabase/commit-versions.py).
#
# Secrets (Kestra secret(), fetched from Vault when Kestra starts): TELEGRAM_*,
# DEPLOY_SSH_KEY, GITEA_TOKEN, SUPABASE_*, N8N_WEBHOOK_SECRET, MINDWTR_TOKEN.

id: docker-update-check
namespace: homelab

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    timezone: Europe/Berlin
  - id: telegram-trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "<KESTRA_WEBHOOK_KEY>"

tasks:
  # Registry check on the host; the update list always goes out, even if
  # Supabase/n8n/Mindwtr (below) are not reachable.
  - id: check
    type: io.kestra.plugin.fs.ssh.Command
    # #100: the only path to Docker -- homelab-deploy on the host (forced command)
    host: 172.22.0.1
    username: deploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('DEPLOY_SSH_KEY') }}"
    timeout: PT15M
    commands:
      - update-check

  - id: notify
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      BOT_TOKEN: "{{ secret('TELEGRAM_BOT_TOKEN') }}"
      CHAT_ID: "{{ secret('TELEGRAM_CHAT_ID') }}"
      REPORT: "{{ outputs.check.vars.report }}"
    commands:
      - printf '%s' "$REPORT" | python3 /repo/scripts/kestra/telegram-send.py

  - id: inventory
    type: io.kestra.plugin.fs.ssh.Command
    # #100: the only path to Docker -- homelab-deploy on the host (forced command)
    host: 172.22.0.1
    username: deploy
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('DEPLOY_SSH_KEY') }}"
    commands:
      - ps

  # Issue #72: every further step starts from this run.
  #   0. running containers -> inventory (must run before 1.: candidates for images
  #      without a versions.yaml entry must exist there)
  #   1. findings -> update_candidates (Supabase)
  #   2. open candidates without a task: changelog via n8n, Mindwtr task, Telegram if
  #      needed; close the tasks of finished candidates (also catches up on backlog)
  #   3. generate config/versions.yaml from Supabase and on change commit it to main
  #      (Gitea API) -> push webhook -> update-on-merge deploys changed target versions
  # All steps run even if one fails; the execution is then marked as failed.
  - id: candidates
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      UPDATES_JSONL: "{{ outputs.check.vars.updates }}"
      CONTAINERS_JSONL: "{{ outputs.inventory.vars.containers }}"
      BOT_TOKEN: "{{ secret('TELEGRAM_BOT_TOKEN') }}"
      CHAT_ID: "{{ secret('TELEGRAM_CHAT_ID') }}"
      SUPABASE_URL: http://supabase-envoy:8000
      SUPABASE_ANON_KEY: "{{ secret('SUPABASE_ANON_KEY') }}"
      SUPABASE_JWT: "{{ secret('SUPABASE_SYNC_JWT') }}"
      N8N_URL: http://n8n:5678/webhook/changelog-summary
      N8N_WEBHOOK_SECRET: "{{ secret('N8N_WEBHOOK_SECRET') }}"
      MINDWTR_URL: http://mindwtr-cloud:8787
      MINDWTR_TOKEN: "{{ secret('MINDWTR_TOKEN') }}"
      GITEA_URL: http://gitea:3000
      GITEA_REPO: owner/homelab
      GITEA_TOKEN: "{{ secret('GITEA_TOKEN') }}"
    commands:
      - |
        cd /repo
        RC=0
        printf '%s' "$CONTAINERS_JSONL" | python3 scripts/supabase/record-inventory.py || RC=1
        printf '%s' "$UPDATES_JSONL" | python3 scripts/supabase/record-candidates.py || RC=1
        python3 scripts/supabase/process-candidate.py pending || RC=1
        python3 scripts/supabase/commit-versions.py || RC=1
        exit $RC

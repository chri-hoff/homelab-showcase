---
services:
  vault:
    image: hashicorp/vault:${VERSION:?error}
    container_name: vault
    restart: unless-stopped

    env_file:
      - vault.env

    command: [ "vault", "server", "-config=/vault/config/vault.hcl" ]

    # Hardening (#103): vault.hcl sets disable_mlock = true (raft) -> no IPC_LOCK, and
    # SKIP_SETCAP skips the entrypoint's setcap on the binary. Entrypoint chowns as
    # root and drops to user vault via su-exec -> CHOWN/SETUID/SETGID.
    environment:
      SKIP_SETCAP: "true"
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    volumes:
      - /mnt/wd-750/docker/data/vault/data:/vault/data
      # Audit log on the SSD (#101 STEP 1): file device "file" writes audit.log here,
      # rotated by /etc/logrotate.d/vault-audit (scripts/vault/vault-audit.logrotate).
      # The host directory must belong to the image user vault (uid 100): the entrypoint
      # does not chown it with this command line ("vault server ..." instead of "server").
      - /opt/docker/vault/logs:/vault/logs
      - /opt/docker/vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # #101 STEP 5: backend only. Every consumer (entrypoints, vault-agent sidecars,
    # Traefik, host scripts via the backend IP or docker exec) is on backend; on
    # frontend any container there could reach the plain-HTTP API.
    networks:
      - backend

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # exit 0 = unsealed, exit 2 = sealed but running — both are healthy for routing
      test: [ "CMD", "sh", "-c", "vault status -address=http://localhost:8200;" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - traefik.enable=true
      # Only reachable over backend now
      - traefik.docker.network=backend
      - traefik.http.routers.vault.entrypoints=websecure
      - traefik.http.routers.vault.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.vault.tls=true
      - traefik.http.routers.vault.tls.certresolver=ipv64
      - traefik.http.services.vault.loadbalancer.server.port=8200
      - traefik.http.routers.vault.middlewares=vault-chain@file

networks:
  backend:
    external: true

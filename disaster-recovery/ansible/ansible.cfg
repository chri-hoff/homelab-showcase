[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Bootstrap secrets (ansible-vault): password from the password manager, entered per run
#   ansible-playbook site.yml --ask-vault-pass
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true

---
# First, before any package can take these system IDs: same IDs as on the old host,
# so files restored from Borg keep their owner.
- name: Group svc-docker
  ansible.builtin.group:
    name: svc-docker
    gid: "{{ svc_docker_gid }}"
    system: true

- name: Service user svc-docker (owner of /opt/docker/loki)
  ansible.builtin.user:
    name: svc-docker
    uid: "{{ svc_docker_uid }}"
    group: svc-docker
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# Containers bind-mount /etc/timezone (Vault and others). Debian 13 no longer creates it;
# a missing file would make Docker create a directory there and the container fail.
- name: /etc/timezone for containers that mount it
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ base_timezone }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Locale generated
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present

# Newer Debian locales packages turn /etc/default/locale into a symlink to /etc/locale.conf
# (seen 2026-11-13). follow: write through the link instead of replacing it with a file,
# otherwise every package update and every Ansible run would flip it back and forth.
- name: Default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    follow: true
    content: |
      #  File generated by update-locale
      LANG="{{ base_locale }}"
    owner: root
    group: root
    mode: "0644"

# --- Unattended upgrades: security + point releases, reboot at 02:00 if required ---
- name: Unattended upgrades enabled
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Unattended upgrades configuration
  ansible.builtin.template:
    src: 52unattended-upgrades-homelab.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-homelab
    owner: root
    group: root
    mode: "0644"

# --- Users ---
- name: Admin user (shell fish, sudo)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /usr/bin/fish
    groups: [sudo]
    append: true

- name: Admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('ansible.builtin.file', admin_authorized_keys_file) }}"
    exclusive: true
  when: admin_authorized_keys_file is file

# --- SSH: same drop-in as on the old host (#126) ---
- name: SSH hardening drop-in
  ansible.builtin.copy:
    src: "{{ homelab_repo }}/scripts/security/sshd-homelab.conf"
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

# --- Unused services off ---
- name: Unused network services masked
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ base_masked_units }}"

# --- Wake-on-LAN ---
- name: Wake-on-LAN unit
  ansible.builtin.template:
    src: wol.service.j2
    dest: /etc/systemd/system/wol.service
    owner: root
    group: root
    mode: "0644"
  when: wol_interface | default('') | length > 0

- name: Wake-on-LAN enabled
  ansible.builtin.systemd_service:
    name: wol.service
    enabled: true
    daemon_reload: true
  when: wol_interface | default('') | length > 0

# --- sops (not packaged) ---
- name: Installed sops version
  ansible.builtin.command: /usr/local/bin/sops --version
  register: base_sops_installed
  changed_when: false
  check_mode: false
  failed_when: false

- name: Sops binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ base_sops_version }}/sops-v{{ base_sops_version }}.linux.amd64"
    checksum: "sha256:https://github.com/getsops/sops/releases/download/v{{ base_sops_version }}/sops-v{{ base_sops_version }}.checksums.txt"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"
    force: true
  when: base_sops_version not in (base_sops_installed.stdout | default(''))

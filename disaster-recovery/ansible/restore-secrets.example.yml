---
# Template for restore-secrets.yml -- the only secret restore.yml needs that is not on a
# surviving disk. Two different secrets are involved:
#   - the ANSIBLE-VAULT password (Vaultwarden "Ansible-Vault") LOCKS this file -- the same
#     one that locks files/luks/*.vault; ansible-vault asks for it
#   - the BORG passphrase is the CONTENT of this file (the line below)
# Create it ansible-vault encrypted:
#
#   cd ansible
#   ansible-vault create restore-secrets.yml
#
# Value in Vault: homelab/backup/borg-docker, key "passphrase"
#   docker exec -it vault vault kv get -mount=homelab -field=passphrase backup/borg-docker
#
# Not needed here: smtp credentials, Telegram token, Traefik bouncer key (they come back
# with /opt/docker/secrets), SOPS age key (/home/<user>/.config/sops/age/keys.txt survives),
# LUKS keys (files/luks/*.vault).
vault_borg_passphrase_docker: "CHANGE-ME"

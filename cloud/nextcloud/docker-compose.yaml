include:
  - /opt/docker/secrets/secrets.yaml
services:
  app:
    image: nextcloud:${VERSION}
    container_name: nextcloud
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ROLE_ID=$$(cat /run/secrets/nextcloud_vault_role_id)
        SECRET_ID=$$(cat /run/secrets/nextcloud_vault_secret_id)
        LOGIN_RESPONSE=$$(curl -sf -X POST \
          -d "{\"role_id\":\"$$ROLE_ID\",\"secret_id\":\"$$SECRET_ID\"}" \
          http://vault:8200/v1/auth/approle/login)
        VAULT_TOKEN=$$(echo "$$LOGIN_RESPONSE" | grep -o '"client_token":"[^"]*"' | cut -d'"' -f4)

        MARIADB_RESPONSE=$$(curl -sf -H "X-Vault-Token: $$VAULT_TOKEN" \
          http://vault:8200/v1/homelab/data/databases/mariadb)
        export MYSQL_PASSWORD=$$(echo "$$MARIADB_RESPONSE" | grep -o '"nextcloud_password":"[^"]*"' | cut -d'"' -f4)

        # Redis currently runs without requirepass -> no password needed for sessions/cache
        exec /entrypoint.sh apache2-foreground
    #user: "33:33"
    env_file:
      - nextcloud.env

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/status.php" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # mem_limit instead of deploy.resources: deploy.resources is not enforced without Swarm
    mem_limit: 5g
    mem_reservation: 1g

    volumes:
      - /opt/docker/nextcloud/html:/var/www/html
      - /opt/docker/nextcloud/custom_apps:/var/www/html/custom_apps
      - /opt/docker/nextcloud/config:/var/www/html/config
      - /mnt/nextcloud/nextcloud/:/var/www/html/data
      # - /opt/docker/nextcloud/php-conf/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini:ro

    environment:
      TZ: Europe/Berlin
      # DB (use secret for password)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: ""
      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_HOST_PORT: ${REDIS_HOST_PORT}
      REDIS_HOST_PASSWORD_FILE: ""
      # Reverse proxy settings
      NEXTCLOUD_TRUSTED_DOMAINS: ${TRAEFIK_HOST}
      OVERWRITEHOST: ${TRAEFIK_HOST}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${TRAEFIK_HOST}

    secrets:
      - nextcloud_vault_role_id
      - nextcloud_vault_secret_id

    labels:
      - traefik.enable=true

      # HTTP -> HTTPS redirect router
      - traefik.http.routers.nextcloud-http.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.nextcloud-http.entrypoints=web
      - traefik.http.routers.nextcloud-http.middlewares=nextcloud-redirect

      - traefik.http.middlewares.nextcloud-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.nextcloud-redirect.redirectscheme.permanent=true

      # HTTPS router (uses IPv64/ACME certresolver name you configured in Traefik)
      - traefik.http.routers.nextcloud-https.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.nextcloud-https.entrypoints=websecure
      - traefik.http.routers.nextcloud-https.tls=true
      - traefik.http.routers.nextcloud-https.tls.certresolver=ipv64

      # Service port inside container
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

      # Nextcloud well-known redirects (CalDAV/CardDAV & WebFinger/NodeInfo)
      - traefik.http.middlewares.nc-wellknown1.redirectregex.permanent=true
      - traefik.http.middlewares.nc-wellknown1.redirectregex.regex=^https?://([^/]+)/.well-known/(card|cal)dav
      - traefik.http.middlewares.nc-wellknown1.redirectregex.replacement=https://$${1}/remote.php/dav

      - traefik.http.middlewares.nc-wellknown2.redirectregex.permanent=true
      - traefik.http.middlewares.nc-wellknown2.redirectregex.regex=^https?://([^/]+)/.well-known/(webfinger|nodeinfo)
      - traefik.http.middlewares.nc-wellknown2.redirectregex.replacement=https://$${1}/index.php/.well-known/$$2

      # Attach the middlewares to HTTPS router
      - traefik.http.routers.nextcloud-https.middlewares=nc-wellknown1,nc-wellknown2,nextcloud-chain@file

    restart: unless-stopped
    networks:
      - frontend
      - backend

networks:
  backend:
    external: true
  frontend:
    external: true

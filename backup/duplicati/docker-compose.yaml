include:
  - /opt/docker/secrets/secrets.yaml
services:
  duplicati:
    container_name: duplicati
    image: duplicati/duplicati:${VERSION}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ROLE_ID=$$(cat /run/secrets/duplicati_vault_role_id)
        SECRET_ID=$$(cat /run/secrets/duplicati_vault_secret_id)
        LOGIN_RESPONSE=$$(curl -sf -X POST \
          -d "{\"role_id\":\"$$ROLE_ID\",\"secret_id\":\"$$SECRET_ID\"}" \
          http://vault:8200/v1/auth/approle/login)
        VAULT_TOKEN=$$(echo "$$LOGIN_RESPONSE" | grep -o '"client_token":"[^"]*"' | cut -d'"' -f4)

        SECRET_RESPONSE=$$(curl -sf -H "X-Vault-Token: $$VAULT_TOKEN" \
          http://vault:8200/v1/homelab/data/services/duplicati)
        export DUPLICATI__WEBSERVICE_PASSWORD=$$(echo "$$SECRET_RESPONSE" | grep -o '"webservice_password":"[^"]*"' | cut -d'"' -f4)
        # Encrypts the secrets in the server database (backup passphrases, destination
        # credentials). Without it Duplicati stores them in plain text on a server without
        # a keyring ("Unencrypted database"). Refuse to start without the key: an empty
        # value would silently write new secrets unencrypted, or leave already encrypted
        # fields unreadable.
        export SETTINGS_ENCRYPTION_KEY=$$(echo "$$SECRET_RESPONSE" | grep -o '"settings_encryption_key":"[^"]*"' | cut -d'"' -f4)
        [ -n "$$SETTINGS_ENCRYPTION_KEY" ] || { echo "FEHLER: settings_encryption_key fehlt in Vault (homelab/services/duplicati)" >&2; exit 1; }

        exec /usr/bin/tini -- /run-as-user.sh duplicati-server
    env_file:
      - duplicati.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - DUPLICATI__WEBSERVICE_INTERFACE=any
      - DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES=*
    volumes:
      - /opt/docker/duplicati/config:/config
      - /data/backup:/backups
      # #126: only what is backed up, no longer the whole host (/:/source:ro made
      # /opt/docker/secrets -- every AppRole -- readable). Same path inside the
      # container as before, so existing job sources (/source/data/backup/...) stay valid.
      - /data/backup:/source/data/backup:ro
    secrets:
      - duplicati_vault_role_id
      - duplicati_vault_secret_id
    labels:
      - traefik.enable=true
      - traefik.http.routers.duplicati.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.duplicati.entrypoints=websecure
      - traefik.http.routers.duplicati.tls=true
      - traefik.http.routers.duplicati.tls.certresolver=ipv64
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
      - traefik.http.routers.duplicati.middlewares=only-trusted@file

    restart: unless-stopped
    # Hardening (#103): runs as root (PUID/PGID are not evaluated by run-as-user.sh);
    # DAC_READ_SEARCH so backups owned by other users with mode 600 (dumps, snapshots)
    # can be read
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://localhost:8200/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - frontend
      - backend

networks:
  frontend:
    external: true
  backend:
    external: true

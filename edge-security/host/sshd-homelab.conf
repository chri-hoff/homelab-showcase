# sshd hardening for the homelab host (#126).
# Installed as /etc/ssh/sshd_config.d/10-homelab.conf. sshd uses the first value it reads,
# and Ubuntu includes sshd_config.d/*.conf alphabetically at the top of sshd_config, so
# "10-" wins over the distribution defaults (e.g. 50-cloud-init.conf).
#
#   sudo install -m 644 scripts/security/sshd-homelab.conf /etc/ssh/sshd_config.d/10-homelab.conf
#   sudo sshd -t && sudo systemctl reload ssh      # keep the current session open, test a new one
#   rollback: sudo rm /etc/ssh/sshd_config.d/10-homelab.conf && sudo systemctl reload ssh

# Keys only
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# No direct root login (Ubuntu default is "without-password", i.e. root with a key);
# root only via sudo, so every admin action is tied to a user
PermitRootLogin no

# Only known accounts. deploy (Kestra -> homelab-deploy forced command, #100) only from
# Kestra's fixed address -- the same restriction as from= in its authorized_keys.
AllowUsers admin deploy@172.22.0.250

http:
    middlewares:
        # this name must match the middleware entry in the container's compose file, e.g. "traefik.http.routers.nginx-site.middleware=authentik@file"
        authentik:
            forwardAuth:
                # The address must contain the container name of the authentik server.
                address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
                trustForwardHeader: true
                maxResponseBodySize: 1048576
#                authRequestHeaders:
#                    - X-Forwarded-Proto
#                    - X-Forwarded-Host
#                    - X-Forwarded-Uri
#                    - X-Forwarded-For
#                    - Authorization
#                    - Cookie
                authResponseHeaders:
                    - X-authentik-username
                    - X-authentik-groups
                    - X-authentik-entitlements
                    - X-authentik-email
                    - X-authentik-name
                    - X-authentik-uid
                    - X-authentik-jwt
                    - X-authentik-meta-jwks
                    - X-authentik-meta-outpost
                    - X-authentik-meta-provider
                    - X-authentik-meta-app
                    - X-authentik-meta-version
                    - authorization

---
include:
  - /opt/docker/secrets/secrets.yaml
services:
  reverse-proxy:
    image: traefik:${VERSION:-latest}
    container_name: traefik
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ROLE_ID=$$(cat /run/secrets/traefik_vault_role_id)
        SECRET_ID=$$(cat /run/secrets/traefik_vault_secret_id)
        LOGIN_RESPONSE=$$(wget -qO- \
          --header="Content-Type: application/json" \
          --post-data="{\"role_id\":\"$$ROLE_ID\",\"secret_id\":\"$$SECRET_ID\"}" \
          http://vault:8200/v1/auth/approle/login)
        VAULT_TOKEN=$$(echo "$$LOGIN_RESPONSE" | grep -o '"client_token":"[^"]*"' | cut -d'"' -f4)

        SECRET_RESPONSE=$$(wget -qO- --header="X-Vault-Token: $$VAULT_TOKEN" \
          http://vault:8200/v1/homelab/data/services/traefik)
        export IPV64_API_KEY=$$(echo "$$SECRET_RESPONSE" | grep -o '"ipv64_api_key":"[^"]*"' | cut -d'"' -f4)

        exec /usr/local/bin/traefik "$$@"
      - --
    env_file:
      - traefik.env
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard (8080) and metrics (8082) deliberately NOT published:
      # dashboard only via traefik.lan (std-adm-internal-chain),
      # Prometheus scrapes traefik:8082 over the backend network.
    # No CLI flags: Traefik reads its static configuration from
    # /etc/traefik/traefik.yaml, CLI flags would be ignored then.
    environment:
      # Optional: wait times/intervals for the DNS propagation check (seconds)
      - IPV64_PROPAGATION_TIMEOUT=120
      - IPV64_POLLING_INTERVAL=5
    secrets:
      - traefik_vault_role_id
      - traefik_vault_secret_id
    volumes:
      - /opt/docker/traefik/config/conf:/etc/traefik/conf
      - /opt/docker/traefik/config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional: ACME storage, if you point it to /letsencrypt/acme.json in traefik.yaml
      - /opt/docker/traefik/letsencrypt:/letsencrypt
      - /opt/docker/traefik/logs/:/var/log/traefik
      - /opt/docker/traefik/plugins-local:/plugins-local
    labels:
      - traefik.enable=true
      # Dashboard/API via internal service (api.insecure: false in traefik.yaml)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.middlewares=std-adm-internal-chain@file

    networks:
      - frontend
      - backend
    restart: unless-stopped
networks:
   frontend:
      external: true
   backend:
      external: true
